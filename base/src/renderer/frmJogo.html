<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Jogo</title>
    <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <h4 class="mb-3 text-primary">Cadastrar Jogo</h4>

    <form id="formJogo">
        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" id="titulo" name="titulo" class="form-control" maxlength="100" required>
        </div>

        <div class="mb-3">
            <label for="genero" class="form-label">Gênero</label>
            <input type="text" id="genero" name="genero" class="form-control" maxlength="100" placeholder="Ex: RPG" required>
        </div>

        <div class="mb-3">
            <label for="tipo_midia" class="form-label">Tipo de Mídia</label>
            <select id="tipo_midia" name="tipo_midia" class="form-select" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="Fisico">Físico</option>
                <option value="Digital">Digital</option>
            </select>
        </div>

        <div class="mb-4">
            <label for="ano_lancamento" class="form-label">Ano de Lançamento</label>
            <input type="number" id="ano_lancamento" name="ano_lancamento" class="form-control" min="1970" max="2100" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar</button>
    </form>

    <script src="js/frmJogo.js"></script>
</body>
</html>
