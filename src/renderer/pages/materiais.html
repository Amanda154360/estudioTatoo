<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>Materiais</title>
    <link href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <main class="container-fluid p-4">
      <header class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="mb-0">Materiais</h3>
          <small class="text-muted">Catálogo — materiais ativos</small>
        </div>
        <div class="d-flex gap-2">
          <button id="btnAtualizar" class="btn btn-outline-secondary" type="button">Atualizar</button>
          <button id="btnNovo" class="btn btn-primary" type="button">+ Novo material</button>
        </div>
      </header>
      <div id="areaAvisos"></div>
      <section class="card mb-3 shadow-sm">
        <div class="card-body row g-2 align-items-end">
          <div class="col-md-8">
            <label for="campoBusca" class="form-label small fw-bold mb-1">Buscar material</label>
            <input id="campoBusca" class="form-control" maxlength="120" placeholder="Nome ou descrição" />
          </div>
          <div class="col-md-4">
            <button id="btnBuscar" class="btn btn-outline-primary w-100" type="button">Buscar</button>
          </div>
        </div>
      </section>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Materiais cadastrados</h5>
        <span id="contador" class="badge bg-secondary">0</span>
      </div>
      <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead><tr><th>Nome</th><th>Unidade</th><th>Descrição</th><th class="text-end">Ações</th></tr></thead>
          <tbody id="corpoTabela"><tr><td colspan="4" class="text-center text-muted">Carregando...</td></tr></tbody>
        </table>
      </div>
    </main>

    <div class="modal fade" id="modalMaterial" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formMaterial">
            <div class="modal-header">
              <h5 class="modal-title" id="tituloModal">Novo material</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
              <label for="campoNome" class="form-label">Nome *</label>
              <input id="campoNome" class="form-control mb-3" maxlength="120" required />
              <label for="campoUnidade" class="form-label">Unidade de medida *</label>
              <input id="campoUnidade" class="form-control mb-3" maxlength="30" required />
              <label for="campoDescricao" class="form-label">Descrição</label>
              <textarea id="campoDescricao" class="form-control" maxlength="65535" rows="3"></textarea>
              <div id="erroFormulario" class="alert alert-danger py-2 mt-3 d-none"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="../../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="materiais.js"></script>
  </body>
</html>
