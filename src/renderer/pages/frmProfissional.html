<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Profissional</title>
  <link href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilo.css" rel="stylesheet">
  <style>
    .badge-sql {
      font-size: 0.75rem;
      background-color: var(--cor-rosa);
      color: var(--cor-escura);
      font-weight: 600;
    }
  </style>
</head>
<body class="p-4 bg-light">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 id="tituloFormulario" class="text-primary m-0">Cadastrar Profissional</h4>
    <span class="badge badge-sql px-2 py-1">Estúdio Tattoo</span>
  </div>

  <form id="formProfissional" autocomplete="off">
    <input type="hidden" id="id" name="id">

    <div class="card mb-3 p-3 shadow-sm border-1">
      <h6 class="fw-bold mb-3 text-secondary">Dados Cadastrais</h6>

      <div class="mb-3">
        <label for="nome" class="form-label">Nome do Profissional / Artista *</label>
        <input type="text" id="nome" name="nome" class="form-control" maxlength="150" required placeholder="Ex: Lucas 'Shadow' Silveira">
      </div>

      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" id="cpf" name="cpf" class="form-control" maxlength="14" placeholder="000.000.000-00">
        </div>
        <div class="col-md-6">
          <label for="telefone" class="form-label">Telefone / WhatsApp *</label>
          <input type="text" id="telefone" name="telefone" class="form-control" maxlength="20" required placeholder="(11) 98765-4321">
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail Profissional</label>
        <input type="email" id="email" name="email" class="form-control" maxlength="100" placeholder="artista@estudiotattoo.com">
      </div>
    </div>

    <div class="card mb-3 p-3 shadow-sm border-1">
      <h6 class="fw-bold mb-3 text-secondary">Atuação & Especialidade</h6>

      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label for="especialidade" class="form-label">Especialidade Principal *</label>
          <select id="especialidade" name="especialidade" class="form-select" required>
            <option value="Tatuador" selected>Tatuador</option>
            <option value="Body Piercer">Body Piercer</option>
            <option value="Esteticista">Esteticista</option>
            <option value="Micropigmentador">Micropigmentador</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="comissao_percentual" class="form-label">Comissão (%)</label>
          <input type="number" id="comissao_percentual" name="comissao_percentual" class="form-control" min="0" max="100" step="0.5" value="50.00">
        </div>
        <div class="col-md-3">
          <label for="ativo" class="form-label">Status</label>
          <select id="ativo" name="ativo" class="form-select">
            <option value="1" selected>Ativo</option>
            <option value="0">Inativo</option>
          </select>
        </div>
      </div>

      <div class="mb-2">
        <label for="observacoes" class="form-label">Estilo / Observações</label>
        <textarea id="observacoes" name="observacoes" class="form-control" rows="3" placeholder="Ex: Especialista em Blackwork, Fine line, Joalheria em Titânio, etc."></textarea>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-secondary w-50" onclick="window.close()">Cancelar</button>
      <button type="submit" class="btn btn-primary w-50 fw-bold">Salvar Profissional</button>
    </div>
  </form>

  <script src="../js/utils/formatters.js"></script>
  <script src="../js/frmProfissional.js"></script>
</body>
</html>
