<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Cliente</title>
  <link href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/estilo.css" rel="stylesheet">
  <style>
    .badge-sql {
      font-size: 0.75rem;
      background-color: var(--cor-rosa);
      color: var(--cor-escura);
      font-weight: 600;
    }
  </style>
</head>
<body class="p-4 bg-light">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 id="tituloFormulario" class="text-primary m-0">Cadastrar Cliente</h4>
    <span class="badge badge-sql px-2 py-1">Integração SQL</span>
  </div>

  <form id="formCliente" autocomplete="off">
    <input type="hidden" id="id" name="id">

    <div class="card mb-3 p-3 shadow-sm border-1">
      <h6 class="fw-bold mb-3 text-secondary">Dados Pessoais & Contato</h6>
      <div class="row g-2">
        <div class="col-md-8">
          <label for="nome" class="form-label">Nome Completo *</label>
          <input type="text" id="nome" name="nome" class="form-control" maxlength="150" required placeholder="Ex: Mariana Duarte Costa">
        </div>
        <div class="col-md-4">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" id="cpf" name="cpf" class="form-control" maxlength="14" placeholder="000.000.000-00">
        </div>
        <div class="col-md-4">
          <label for="telefone" class="form-label">Telefone / WhatsApp *</label>
          <input type="text" id="telefone" name="telefone" class="form-control" maxlength="20" required placeholder="(11) 99999-9999">
        </div>
        <div class="col-md-5">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" maxlength="100" placeholder="cliente@email.com">
        </div>
        <div class="col-md-3">
          <label for="data_nascimento" class="form-label">Data Nasc.</label>
          <input type="date" id="data_nascimento" name="data_nascimento" class="form-control">
        </div>
      </div>
    </div>

    <!-- LOCALIZAÇÃO & BUSCA DE CEP VIA SQL -->
    <div class="card mb-3 p-3 shadow-sm border-1">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold m-0 text-secondary">Endereço (Busca de CEP em SQL)</h6>
        <span id="feedbackCep" class="text-muted small"></span>
      </div>

      <div class="row g-2">
        <div class="col-md-4">
          <label for="cep" class="form-label">CEP *</label>
          <div class="input-group">
            <input type="text" id="cep" name="cep" class="form-control" maxlength="9" placeholder="00000-000" required>
            <button class="btn btn-outline-secondary" type="button" id="btnBuscarCep" title="Buscar CEP na base SQL">
              Buscar
            </button>
          </div>
        </div>
        <div class="col-md-6">
          <label for="logradouro" class="form-label">Logradouro / Rua *</label>
          <input type="text" id="logradouro" name="logradouro" class="form-control" maxlength="150" required placeholder="Rua / Avenida">
        </div>
        <div class="col-md-2">
          <label for="numero" class="form-label">Número *</label>
          <input type="text" id="numero" name="numero" class="form-control" maxlength="20" required placeholder="123">
        </div>
        <div class="col-md-4">
          <label for="complemento" class="form-label">Complemento</label>
          <input type="text" id="complemento" name="complemento" class="form-control" maxlength="100" placeholder="Apto, Bloco">
        </div>
        <div class="col-md-3">
          <label for="bairro" class="form-label">Bairro *</label>
          <input type="text" id="bairro" name="bairro" class="form-control" maxlength="100" required placeholder="Bairro">
        </div>
        <div class="col-md-3">
          <label for="cidade" class="form-label">Cidade *</label>
          <input type="text" id="cidade" name="cidade" class="form-control" maxlength="100" required placeholder="Cidade">
        </div>
        <div class="col-md-2">
          <label for="estado" class="form-label">UF *</label>
          <select id="estado" name="estado" class="form-select" required>
            <option value="" disabled selected>UF</option>
            <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
            <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
            <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
            <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
            <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
            <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
            <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
            <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
            <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ANAMNESE / OBSERVAÇÕES MÉDICAS (Tatuagem & Piercing) -->
    <div class="card mb-3 p-3 shadow-sm border-1">
      <h6 class="fw-bold mb-2 text-secondary">Ficha de Anamnese & Observações Médicas</h6>
      <textarea id="observacoes_medicas" name="observacoes_medicas" class="form-control" rows="2" 
        placeholder="Alergias a tintas/metais, queloides, diabetes, uso de anticoagulantes ou observações do procedimento..."></textarea>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-secondary w-50" onclick="window.close()">Cancelar</button>
      <button type="submit" class="btn btn-primary w-50 fw-bold">Salvar Cliente</button>
    </div>
  </form>

  <script src="../js/utils/formatters.js"></script>
  <script src="../js/frmCliente.js"></script>
</body>
</html>
